
[core]
@copyFromSection: template_civilianGreatWallDesc
copyFrom: ROOT:Data/Strings/buildings.template, ROOT:Data/Templates/civilian.template, ROOT:Data/Templates/building.template
name: civilianGreatWall
tags: building, greatWall, 3x3

class: CustomUnitMetadata
price: Spice=500
maxHp: 1000
mass: 1000
techLevel: 1

radius: 14
displayRadius: 10
fogOfWarSightRange:0

isUnselectable: true
isUnselectableAsTarget: false
disableAllUnitCollisions:false
ignoreInUnitCapCalculation: true
showOnMinimap: false
buildSpeed: 0s
selfBuildRate: 0s

footprint: -1,-1,1,1
constructionFootprint: -1,-1,1,1
buildingToFootprintOffsetX:10
buildingToFootprintOffsetY:10
isBuilding: true
explodeOnDeath: false

effectOnDeath:CUSTOM:explodeBuilding2, CUSTOM:explodeBuilding2_c2, CUSTOM:explodeBuilding2_c3, CUSTOM:explodeBuilding2_c4, CUSTOM:explodeBuilding2_c5, CUSTOM:explodeBuilding2_c6, CUSTOM:explodeBuilding2_c7, CUSTOM:explodeBuilding2_c8, CUSTOM:explodeBuilding2_c9

[hiddenAction_onCreate]
autoTriggerOnEvent: created
playSoundAtUnit: ROOT:Data/Sound/placeStructure.wav, ROOT:Data/Sound/placeStructure2.wav

[arm_1]
x:0
y: 0
image_end: up.png
hidden: if self.getOffsetRelative(y=40).numberOfUnitsInTeam(withTag="greatWall", lessThan=1, withinRange=30)
drawOverBody: true

[arm_2]
x: 0
y: 0
image_end: left.png
hidden: if self.getOffsetRelative(x=-40).numberOfUnitsInTeam(withTag="greatWall", lessThan=1, withinRange=30)
drawOverBody: true

[arm_3]
x: 0
y: 0
image_end: right.png
hidden: if self.getOffsetRelative(x=40).numberOfUnitsInTeam(withTag="greatWall", lessThan=1, withinRange=30)
drawOverBody: true

[arm_4]
x: 0
y: 0
image_end: down.png
hidden: if self.getOffsetRelative(y=-40).numberOfUnitsInTeam(withTag="greatWall", lessThan=1, withinRange=30)
drawOverBody: true

[graphics]
drawLayer: bottom
frame_width: 48
frame_height: 48
default_frame: 0
image: civilianGreatWall.png
image_back: NONE
image_wreak: ROOT:Data/Graphics/Remains/wreak_3x3.png
image_shadow:NONE
disableLowHpFire: true
disableLowHpSmoke: true
showQueueBar: false
icon_zoomed_out_neverShow: true
icon_build: ROOT:Data/Graphics/Icons/icon_wall.png
lock_body_rotation_with_main_turret: true
rotate_with_direction: false

[placementRule_Main]
searchDistance: 61

[placementRule_1x1]
searchDistance: 46

[placementRule_2x2]
searchDistance: 61

[placementRule_3x2]
searchDistance: 80

[placementRule_3x3]
searchDistance: 80

[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits: false
canAttackUnderwaterUnits: false
maxAttackRange: 0

[projectile_1]
directDamage: 0
life: 120
instant: true
image: SHARED:blank.png
largeHitEffect: false
explodeEffect: NONE

[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
maxTurnSpeed: 0
turnAcceleration: 0.1

[ai]