life: 1
instant: true
image: SHARED:blank.png
largeHitEffect: false
explodeEffect: NONE

[ai]
buildPriority: 0.5
recommendedInEachBaseNum: 5
recommendedInEachBasePriorityIfUnmet: 0.15
noneInBaseExtraPriority:0.4
maxEachBase: 5